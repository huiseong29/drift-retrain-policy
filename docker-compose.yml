services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - drift-data:/data
    environment:
      MONITOR_INTERVAL: "1.0"
      PSI_TH: "0.2"
      PERF_TOL: "0.05"
      EXPEDITE: "4.0"

  simulator:
    build: .
    depends_on:
      api:
        condition: service_healthy
    command: >
      python -m service.simulator
      --url http://api:8000
      --drift mixed
      --rate 250
      --n 6000
    profiles: ["demo"]

volumes:
  drift-data:
